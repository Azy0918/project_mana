<!doctype html><html lang=ja><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>セリフ・声・トーン編集（第十三レジ）</title>
<style>
*{box-sizing:border-box} body{font-family:system-ui,sans-serif;background:#101216;color:#e8e8ea;margin:0;padding:0 0 80px}
header{position:sticky;top:0;background:#161922;border-bottom:1px solid #2a2f3a;padding:10px 14px;z-index:5}
h1{font-size:15px;margin:0 0 6px} .muted{color:#8a92a0;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,textarea,button{font:inherit;background:#1d212b;color:#e8e8ea;border:1px solid #333a47;border-radius:7px;padding:6px 8px}
button{cursor:pointer;background:#2a3340;border-color:#3a4658} button.go{background:#2f6df6;border-color:#2f6df6}
main{padding:10px 14px;max-width:900px;margin:0 auto}
.line{background:#161922;border:1px solid #262b36;border-radius:9px;padding:9px 11px;margin:7px 0}
.head{display:flex;gap:8px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 8px;border-radius:12px;background:#243047;color:#9cc4ff}
.idtag{font-size:11px;color:#6b7280;font-family:monospace}
.line textarea{width:100%;min-height:38px;resize:vertical}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}
.ctl label{font-size:11px;color:#8a92a0;align-self:center}
.small{font-size:11px;color:#8a92a0}
#modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;padding:14px}
#modal .box{max-width:760px;margin:14px auto;background:#161922;border:1px solid #333a47;border-radius:10px;padding:14px}
#modal textarea{width:100%;height:46vh;font-size:13px}
.note{color:#ffd479;font-size:12px}
</style>
<header>
  <h1>セリフ・声・トーン編集 <span class=muted>第十三レジ｜変更→プロンプト生成</span></h1>
  <div class=row>
    <label class=muted>話数</label><select id=ep></select>
    <button id=gen class=go>変更プロンプト生成</button>
    <span id=status class=muted></span>
  </div>
  <div class=small>セリフ／声／トーンを変更して「変更プロンプト生成」→コピー→Claudeに貼ると反映されます。※音声試聴はローカル版アプリでのみ可。</div>
</header>
<main id=list></main>
<div id=modal><div class=box>
  <h3 style="margin:0 0 8px">変更プロンプト（コピーしてClaudeへ）</h3>
  <textarea id=out></textarea>
  <div style="margin-top:8px;display:flex;gap:8px">
    <button class=go onclick="navigator.clipboard.writeText(document.getElementById('out').value);this.textContent='コピーした'">コピー</button>
    <button onclick="document.getElementById('modal').style.display='none'">閉じる</button>
  </div>
</div></div>
<script>
const VOICES=[["Zephyr","明るい/女"],["Puck","元気/男"],["Charon","低め情報的/男"],["Kore","硬め中立/女"],["Fenrir","快活/男"],["Leda","若々しい/女"],["Orus","硬め/男"],["Aoede","軽やか/女"],["Callirrhoe","おっとり/女"],["Autonoe","明るい/女"],["Enceladus","息混じり低/男"],["Iapetus","クリア/男"],["Umbriel","落ち着き/男"],["Algieba","滑らか低/男"],["Despina","滑らか/女"],["Erinome","クリア/女"],["Algenib","しゃがれ/男"],["Rasalgethi","低め説明/男"],["Laomedeia","アップビート/女"],["Achernar","柔らか/女"],["Alnilam","硬め低/男"],["Schedar","均一/男"],["Gacrux","成熟/中"],["Pulcherrima","前向き/女"],["Achird","親しみ/男"],["Zubenelgenubi","カジュアル低/男"],["Vindemiatrix","優しい/女"],["Sadachbia","生き生き/中"],["Sadaltager","知的/男"],["Sulafat","温かい/女"]];
const CAST={"ナレーション":"Charon","タクミ":"Achird","エリ":"Leda","汗田竜司":"Enceladus","第十三レジ":"Umbriel","ナビ":"Despina","未来の会社員":"Iapetus","座木山辰哉":"Algieba","唐沢栄治":"Algenib","トラック運転手":"Orus"};
const EPS=[["ep01","第1話","scene_manifest.json"]];
for(let i=2;i<=12;i++){const n=String(i).padStart(2,'0');EPS.push(["ep"+n,"第"+i+"話","scene_manifest_ep"+n+".json"]);}
let DATA=[], FILE="";
const $=s=>document.querySelector(s);
function vopts(sel){return VOICES.map(([v,t])=>`<option value="${v}" ${v===sel?'selected':''}>${v}（${t}）</option>`).join('')}
async function load(file){
  FILE=file; $('#status').textContent='読込中…';
  try{ DATA=await (await fetch(file+'?cb='+Date.now())).json(); }catch(e){ $('#status').textContent='読込失敗'; DATA=[]; }
  const L=$('#list'); L.innerHTML='';
  DATA.forEach(x=>{
    const sp=x.speaker, cv=CAST[sp]||'Charon', dlg=x.dialogue||'';
    const el=document.createElement('div'); el.className='line'; el.dataset.id=x.id;
    el.dataset.odlg=dlg; el.dataset.ov=cv;
    el.innerHTML=`<div class=head><span class=badge>${sp}</span><span class=idtag>${x.id}</span></div>
      <textarea class=dlg>${dlg}</textarea>
      <div class=ctl><label>声</label><select class=v>${vopts(cv)}</select>
        <label>トーン</label><input class=tone placeholder="例: 淡々と / 明るく（任意）" size=18></div>`;
    L.appendChild(el);
  });
  $('#status').textContent=DATA.length+'行';
}
function gen(){
  const ch=[];
  document.querySelectorAll('.line').forEach(el=>{
    const id=el.dataset.id, dlg=el.querySelector('.dlg').value.trim(), v=el.querySelector('.v').value, tone=el.querySelector('.tone').value.trim();
    const c={};
    if(dlg!==el.dataset.odlg.trim()) c.dlg=[el.dataset.odlg,dlg];
    if(v!==el.dataset.ov) c.v=v;
    if(tone) c.tone=tone;
    if(Object.keys(c).length) ch.push({id,c});
  });
  if(!ch.length){ $('#status').textContent='変更なし'; return; }
  const ep=$('#ep').value;
  let p=`# ${ep} 変更依頼（声・セリフ・トーン）\n以下を反映し音声も再生成してください。\n\n`;
  ch.forEach(o=>{
    p+=`- ${o.id}\n`;
    if(o.c.dlg) p+=`  セリフ: ${o.c.dlg[0]} → ${o.c.dlg[1]}\n`;
    if(o.c.v) p+=`  声: ${o.c.v}\n`;
    if(o.c.tone) p+=`  トーン: ${o.c.tone}\n`;
  });
  $('#out').value=p; $('#modal').style.display='block';
}
const es=$('#ep'); EPS.forEach(([id,lb])=>es.add(new Option(lb,id)));
es.onchange=()=>load(EPS.find(e=>e[0]===es.value)[2]);
$('#gen').onclick=gen;
load(EPS[0][2]);
</script></html>
