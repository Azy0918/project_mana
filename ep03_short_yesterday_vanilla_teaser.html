<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第3話ショート動画 ダウンロード</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1118;
      --panel: #121c26;
      --text: #f1e8d2;
      --accent: #a6c178;
      --muted: #b8c0b0;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    main {
      width: min(100%, 520px);
    }
    h1 {
      font-size: 24px;
      line-height: 1.35;
      margin: 8px 0 8px;
      letter-spacing: 0;
    }
    p {
      color: var(--muted);
      line-height: 1.7;
      margin: 0 0 16px;
    }
    video {
      width: 100%;
      aspect-ratio: 9 / 16;
      display: block;
      border-radius: 8px;
      background: #000;
      border: 1px solid rgba(166, 193, 120, 0.35);
    }
    .actions {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }
    a.button {
      display: block;
      text-align: center;
      padding: 14px 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #07100d;
      font-weight: 700;
      text-decoration: none;
    }
    a.secondary {
      background: var(--panel);
      color: var(--text);
      border: 1px solid rgba(241, 232, 210, 0.22);
    }
    .meta {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>深夜二時の第十三レジ 第3話ショート</h1>
    <p>「昨日に溶けるアイスクリーム」ティザー用ショート動画です。</p>
    <video src="video/ep03_short_yesterday_vanilla_teaser.mp4" controls playsinline preload="metadata"></video>
    <div class="actions">
      <a class="button" href="video/ep03_short_yesterday_vanilla_teaser.mp4" download>MP4をダウンロード</a>
      <a class="button secondary" href="video/ep03_short_yesterday_vanilla_teaser.mp4">動画ファイルを直接開く</a>
    </div>
    <div class="meta">1080x1920 / 30fps / H.264 + AAC / 61.77秒</div>
  </main>
</body>
</html>
