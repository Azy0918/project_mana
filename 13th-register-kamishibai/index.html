<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>第十三レジ 紙芝居版</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #07090d;
        color: #f5f7fb;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        padding: 18px 14px 34px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 760px);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.35;
      }

      p {
        margin: 0 0 16px;
        color: #b9c4d0;
        font-size: 14px;
        line-height: 1.7;
      }

      video,
      img {
        display: block;
        width: 100%;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      video {
        max-height: 86vh;
      }

      section {
        margin-top: 22px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 16px;
      }

      a {
        color: #9bd8ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>第十三レジ 紙芝居版</h1>
      <p>
        冒頭6カットをリアル寄りイラストへ差し替えた紙芝居プレビューです。残りは仮カードのままです。
      </p>

      <video
        controls
        playsinline
        preload="metadata"
        poster="kamishibai_opening_real_cuts_contact_sheet.jpg"
      >
        <source src="kamishibai_storyboard_preview.mp4" type="video/mp4" />
      </video>

      <section>
        <h2>冒頭6カット</h2>
        <img
          src="kamishibai_opening_real_cuts_contact_sheet.jpg"
          alt="第十三レジ 紙芝居版 冒頭6カット"
        />
      </section>

      <section>
        <h2>36カット全体</h2>
        <img
          src="kamishibai_storyboard_contact_sheet.jpg"
          alt="第十三レジ 紙芝居版 36カット一覧"
        />
      </section>
    </main>
  </body>
</html>
