<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>第十三レジ PV</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #05070b;
        color: #f7fafc;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 14px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 440px);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 18px;
        line-height: 1.35;
        font-weight: 700;
      }

      video {
        display: block;
        width: 100%;
        max-height: 88vh;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.16);
      }

      a {
        color: #9bd8ff;
      }

      p {
        margin: 10px 0 0;
        color: #b9c4d0;
        font-size: 13px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>第十三レジ PV</h1>
      <video
        controls
        playsinline
        preload="metadata"
        poster="vertical_short_pv_v2_clean_contact_sheet.jpg"
      >
        <source src="vertical_short_pv_v2_clean_mobile.mp4" type="video/mp4" />
      </video>
      <p>
        再生できない場合は、ページを再読み込みするか、Safari/Chromeで開いてください。
      </p>
    </main>
  </body>
</html>
