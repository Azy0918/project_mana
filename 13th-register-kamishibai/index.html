<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>深夜二時の第十三レジ 第1話プレビュー</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070b;
      --panel: #101720;
      --line: #26384a;
      --text: #edf7ff;
      --muted: #98a7b8;
      --cyan: #53e5ff;
      --violet: #b58cff;
      --paper: #eee5d4;
      --ink: #1f2730;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(83, 229, 255, 0.12), transparent 28rem),
        radial-gradient(circle at 90% 12%, rgba(181, 140, 255, 0.12), transparent 24rem),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    .preview {
      display: grid;
      grid-template-columns: minmax(260px, 420px) minmax(260px, 1fr);
      gap: 18px;
      align-items: start;
    }

    .phone {
      position: relative;
      width: min(100%, 420px);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border: 1px solid rgba(83, 229, 255, 0.34);
      border-radius: 22px;
      background: #02050a;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42), 0 0 32px rgba(83, 229, 255, 0.18);
    }

    .phone img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-state {
      position: absolute;
      right: 14px;
      bottom: 16px;
      padding: 7px 10px;
      border: 1px solid rgba(83, 229, 255, 0.44);
      border-radius: 999px;
      background: rgba(5, 7, 11, 0.72);
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    .controls {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(16, 23, 32, 0.92);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      letter-spacing: 0;
    }

    .sub {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    audio {
      width: 100%;
      margin: 8px 0 14px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 0 0 14px;
    }

    .metric {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(5, 7, 11, 0.34);
    }

    .metric b {
      display: block;
      color: var(--cyan);
      font-size: 18px;
      line-height: 1.2;
    }

    .metric span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .log {
      max-height: 48vh;
      overflow: auto;
      border: 1px solid rgba(238, 229, 212, 0.28);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
    }

    .line {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      padding: 10px 11px;
      border-bottom: 1px dashed rgba(31, 39, 48, 0.22);
      font-size: 13px;
      line-height: 1.45;
    }

    .line:last-child {
      border-bottom: 0;
    }

    .speaker {
      font-weight: 800;
      color: #27384a;
    }

    .reading {
      margin-top: 4px;
      color: #65707c;
      font-size: 12px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid rgba(83, 229, 255, 0.38);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      background: rgba(83, 229, 255, 0.08);
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      main {
        padding: 10px 10px 20px;
      }

      .preview {
        display: block;
      }

      .phone {
        width: min(100%, 430px);
        margin: 0 auto 12px;
        border-radius: 18px;
      }

      .controls {
        padding: 13px;
      }

      h1 {
        font-size: 21px;
      }

      .log {
        max-height: 34vh;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="preview" aria-label="第1話プレビュー">
      <div class="phone">
        <img src="./assets/ep01_key_visual.png" alt="深夜二時の第十三レジ 第1話の縦型ビジュアル">
        <div class="play-state" id="playState">READY</div>
      </div>

      <div class="controls">
        <h1>深夜二時の第十三レジ</h1>
        <p class="sub">第1話「第十三レジ」スマホ確認用プレビュー。音声は reading_hiragana 列で再生成、ミナは「まお / ふつー」です。</p>

        <audio id="audio" controls preload="metadata" src="./assets/ep01_full_voice_reading_hiragana_mina_mao.wav"></audio>

        <div class="meta">
          <div class="metric"><b id="duration">--:--</b><span>音声尺</span></div>
          <div class="metric"><b id="lineCount">--</b><span>音声行数</span></div>
          <div class="metric"><b>AM 2:17</b><span>画面時刻</span></div>
          <div class="metric"><b>継続中</b><span>本日の営業</span></div>
        </div>

        <div class="log" id="log" aria-label="セリフログ"></div>

        <div class="links">
          <a href="./assets/ep01_full_voice_reading_hiragana_mina_mao.wav" download>音声を保存</a>
          <a href="./assets/ep01_key_visual.png" download>画像を保存</a>
          <a href="./assets/manifest_reading_hiragana_mina_mao.json">manifest</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const audio = document.getElementById("audio");
    const playState = document.getElementById("playState");
    const duration = document.getElementById("duration");
    const lineCount = document.getElementById("lineCount");
    const log = document.getElementById("log");

    const formatTime = seconds => {
      if (!Number.isFinite(seconds)) return "--:--";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${min}:${sec}`;
    };

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("play", () => {
      playState.textContent = "PLAYING";
    });

    audio.addEventListener("pause", () => {
      playState.textContent = audio.currentTime > 0 && audio.currentTime < audio.duration ? "PAUSED" : "READY";
    });

    audio.addEventListener("ended", () => {
      playState.textContent = "ENDED";
    });

    fetch("./assets/manifest_reading_hiragana_mina_mao.json")
      .then(response => response.json())
      .then(rows => {
        const voiced = rows.filter(row => row.clip);
        lineCount.textContent = voiced.length;
        log.innerHTML = voiced.map(row => `
          <div class="line">
            <div class="speaker">${row.character || row.speaker_name || ""}</div>
            <div>
              <div>${row.text || ""}</div>
              <div class="reading">${row.synthesis_text || ""}</div>
            </div>
          </div>
        `).join("");
      })
      .catch(() => {
        lineCount.textContent = "--";
        log.textContent = "manifestを読み込めませんでした。";
      });
  </script>
</body>
</html>
