<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>深夜二時の第十三レジ 画像方向性決定</title>
  <style>
    :root { color-scheme: dark; --bg:#05070b; --panel:#101720; --soft:#142231; --line:#26384a; --text:#edf7ff; --muted:#98a7b8; --cyan:#53e5ff; --violet:#b58cff; --warn:#ffd166; --ok:#86efac; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background: radial-gradient(circle at 18% 0%, rgba(83,229,255,.10), transparent 28rem), var(--bg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { position: sticky; top: 0; z-index: 10; padding: 12px 14px; background: rgba(5,7,11,.92); border-bottom:1px solid var(--line); backdrop-filter: blur(8px); }
    h1 { margin:0 0 8px; font-size:18px; }
    .top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .top label { color:var(--muted); font-size:12px; font-weight:800; }
    select, input, textarea { border:1px solid var(--line); background:rgba(5,7,11,.64); color:var(--text); border-radius:8px; }
    select, input { min-height:34px; padding:6px 9px; font-weight:800; }
    button { min-height:38px; padding:7px 12px; border:1px solid rgba(83,229,255,.42); border-radius:8px; background:rgba(83,229,255,.12); color:var(--cyan); font-weight:900; cursor:pointer; }
    main { width:min(100%,1180px); margin:0 auto; padding:14px; }
    .hint { margin:0 0 12px; color:var(--muted); font-size:12px; line-height:1.6; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(310px,1fr)); gap:12px; }
    .card { border:1px solid var(--line); border-radius:10px; background:rgba(16,23,32,.72); overflow:hidden; }
    .card.active { border-color:rgba(83,229,255,.55); }
    .meta { padding:8px 10px; border-bottom:1px solid var(--line); background:rgba(83,229,255,.07); color:var(--cyan); font-size:12px; font-weight:900; display:flex; justify-content:space-between; gap:8px; }
    .body { display:grid; grid-template-columns:96px 1fr; gap:10px; padding:10px; }
    .thumb { width:96px; aspect-ratio:9/16; object-fit:cover; border-radius:6px; border:1px solid var(--line); background:#02050a; }
    .title { font-size:15px; font-weight:900; margin-bottom:5px; }
    .imgname, .lines { color:var(--muted); font-size:11px; line-height:1.45; word-break:break-all; }
    .line { margin-top:3px; color:#c9d8e8; }
    .controls { padding:0 10px 10px; display:grid; gap:8px; }
    .row { display:grid; grid-template-columns:88px 1fr; gap:8px; align-items:center; }
    .row label { color:var(--muted); font-size:12px; font-weight:800; }
    textarea { width:100%; min-height:54px; padding:8px; resize:vertical; font:13px/1.45 system-ui, sans-serif; }
    .small textarea { min-height:38px; }
    .bar { position:sticky; bottom:0; display:flex; gap:8px; padding:12px 0; margin-top:12px; background:linear-gradient(180deg, transparent, var(--bg) 38%); }
    .bar button { flex:1; min-height:44px; }
    dialog { width:min(96vw,820px); border:1px solid rgba(83,229,255,.5); border-radius:10px; background:var(--panel); color:var(--text); }
    dialog::backdrop { background:rgba(0,0,0,.6); }
    dialog h2 { margin:0 0 8px; font-size:15px; color:var(--cyan); }
    dialog textarea { min-height:55vh; font:12px/1.6 ui-monospace, Consolas, monospace; background:#02050a; }
    .dlg-actions { display:flex; gap:8px; margin-top:10px; }
    .dlg-actions button { flex:1; }
    .status { color:var(--violet); font-size:12px; font-weight:800; }
    @media (max-width:560px) { .grid { grid-template-columns:1fr; } .body { grid-template-columns:86px 1fr; } .thumb { width:86px; } .row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>画像方向性決定 ｜ Codex向け</h1>
    <div class="top">
      <label for="epSelect">話数</label>
      <select id="epSelect"></select>
      <button id="saveBtn" type="button">下書き保存</button>
      <button id="clearBtn" type="button">下書き消去</button>
      <span id="status" class="status"></span>
    </div>
  </header>
  <main>
    <p class="hint">20カットを見ながら画像方針を決めるアプリです。直したいカットだけ「判断」を変更し、問題点・必須・禁止を入れると、Codexへ渡す画像生成/修正プロンプトをまとめて作れます。画像内字幕やUI文字は入れない前提です。</p>
    <div id="cards" class="grid"></div>
    <div class="bar">
      <button id="genPrompt" type="button">Codex向けプロンプト生成</button>
      <button id="exportJson" type="button">方向性JSONを出力</button>
    </div>
  </main>

  <dialog id="out">
    <h2 id="outTitle">出力</h2>
    <textarea id="outText" readonly></textarea>
    <div class="dlg-actions">
      <button id="copyBtn" type="button">コピー</button>
      <button id="downloadBtn" type="button">ダウンロード</button>
      <button id="closeBtn" type="button">閉じる</button>
    </div>
  </dialog>

  <script>
    const EPISODES = [
      { id:"ep01", label:"第1話", visual:"./visual_cut_plan.json", scene:"./scene_manifest.json" },
      { id:"ep02", label:"第2話", visual:"./visual_cut_plan_ep02.json", scene:"./scene_manifest_ep02.json" },
      { id:"ep03", label:"第3話", visual:"./visual_cut_plan_ep03.json", scene:"./scene_manifest_ep03.json" },
    ];
    let EP = EPISODES[2], CUTS = [], SCENES = [], draft = {};
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    const norm = p => !p ? "" : (/^(\.\/|\/|https?:)/.test(p) ? p : "./" + p);
    const base = p => String(p || "").split("/").pop();
    const mmss = s => { s=Number(s)||0; return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"); };
    const key = () => `image_direction_draft_${EP.id}`;

    async function load() {
      $("#status").textContent = "読込中…";
      const [visual, scenes] = await Promise.all([
        fetch(EP.visual).then(r => { if(!r.ok) throw new Error(EP.visual); return r.json(); }),
        fetch(EP.scene).then(r => { if(!r.ok) throw new Error(EP.scene); return r.json(); }),
      ]);
      CUTS = visual; SCENES = scenes;
      draft = JSON.parse(localStorage.getItem(key()) || "{}");
      render();
      $("#status").textContent = `（${EP.label}・${CUTS.length}カット）`;
    }

    function linesFor(cut) {
      const idNum = Number(String(cut.visualCutId || "").replace("vc",""));
      const byIndex = SCENES.filter(s => Number(s.visualCutIndex) === idNum);
      const byImage = SCENES.filter(s => base(s.image) === base(cut.plannedImage));
      const merged = [...byIndex, ...byImage].filter((s, i, a) => a.findIndex(x => x.id === s.id) === i);
      return merged.slice(0, 7);
    }

    function render() {
      $("#cards").innerHTML = CUTS.map((c, i) => {
        const d = draft[c.visualCutId] || {};
        const active = d.decision && d.decision !== "keep";
        const lines = linesFor(c).map(s => `<div class="line">${esc(mmss(s.start))} ${esc(s.speaker)}：${esc(s.dialogue)}</div>`).join("");
        return `<section class="card ${active ? "active" : ""}" data-id="${esc(c.visualCutId)}">
          <div class="meta"><span>${String(i+1).padStart(2,"0")} / 20　${esc(c.visualCutId)}</span><span>${esc(d.decision || "keep")}</span></div>
          <div class="body">
            <img class="thumb" loading="lazy" src="${esc(norm(c.plannedImage))}" onerror="this.style.opacity=.25" alt="">
            <div>
              <div class="title">${esc(c.title)}</div>
              <div class="imgname">${esc(base(c.plannedImage))}</div>
              <div class="lines">${lines || "対応セリフなし"}</div>
            </div>
          </div>
          <div class="controls">
            ${selectRow(c.visualCutId, "decision", "判断", d.decision || "keep", [["keep","採用/維持"],["edit","修正依頼"],["regenerate","新規生成"],["hold","保留"],["replace","手持ち画像で差替"]])}
            ${selectRow(c.visualCutId, "quality", "品質", d.quality || "high", [["high","高"],["medium","中"],["draft","下書き"]])}
            ${areaRow(c.visualCutId, "issue", "問題点", d.issue || "", "例：汗田の左手が破綻、ナビが大きすぎる")}
            ${areaRow(c.visualCutId, "must", "必須", d.must || "", "例：紫ヘルメット、汗田の顔固定、コーヒーは一杯だけ")}
            ${areaRow(c.visualCutId, "avoid", "禁止", d.avoid || "", "例：顔の別人化、画像内字幕、UI文字、手指破綻")}
            ${areaRow(c.visualCutId, "note", "備考", d.note || "", "前後の流れ、参考カット、未確定事項")}
          </div>
        </section>`;
      }).join("");
      document.querySelectorAll("[data-field]").forEach(el => el.addEventListener("input", updateDraft));
    }

    function selectRow(id, field, label, value, options) {
      return `<div class="row"><label>${label}</label><select data-id="${id}" data-field="${field}">${options.map(([v,t]) => `<option value="${v}" ${v===value?"selected":""}>${t}</option>`).join("")}</select></div>`;
    }
    function areaRow(id, field, label, value, ph) {
      return `<div class="row small"><label>${label}</label><textarea data-id="${id}" data-field="${field}" placeholder="${esc(ph)}">${esc(value)}</textarea></div>`;
    }
    function updateDraft(e) {
      const id = e.target.dataset.id, field = e.target.dataset.field;
      draft[id] ||= {}; draft[id][field] = e.target.value;
      updateCardState(id);
    }
    function updateCardState(id) {
      const d = draft[id] || {};
      const card = document.querySelector(`.card[data-id="${id}"]`);
      if (!card) return;
      const active = d.decision && d.decision !== "keep";
      card.classList.toggle("active", !!active);
      const state = card.querySelector(".meta span:last-child");
      if (state) state.textContent = d.decision || "keep";
    }
    function saveDraft() { localStorage.setItem(key(), JSON.stringify(draft)); $("#status").textContent = "保存しました"; }
    function clearDraft() { if(confirm("この話数の方向性下書きを消しますか？")) { draft = {}; localStorage.removeItem(key()); render(); } }
    function selectedItems() {
      return CUTS.map(c => ({ cut:c, d:draft[c.visualCutId] || {}, lines:linesFor(c) }))
        .filter(x => x.d.decision && x.d.decision !== "keep");
    }
    function promptText() {
      const items = selectedItems();
      if (!items.length) return "変更対象のカットがありません。判断を「修正依頼」「新規生成」「保留」「手持ち画像で差替」にしてください。";
      let out = `# Codex画像作業依頼（${EP.label}）\n\n`;
      out += "役割: Codexは画像担当。画像内に字幕UI・会話ウィンドウ・時計・アプリUI文字を入れない。9:16縦、顔と主要被写体は中央寄り、下部30〜40%は字幕ドック用に空ける。\n\n";
      items.forEach(({cut,d,lines}) => {
        out += `## ${cut.visualCutId} ${cut.title}\n`;
        out += `- 現在画像: ${base(cut.plannedImage)}\n- 判断: ${d.decision}\n- 希望品質: ${d.quality || "high"}\n`;
        out += `- 関連セリフ:\n`;
        lines.slice(0,5).forEach(s => { out += `  - ${mmss(s.start)} ${s.speaker}「${s.dialogue}」\n`; });
        if (d.issue) out += `- 問題点: ${d.issue}\n`;
        if (d.must) out += `- 必須: ${d.must}\n`;
        if (d.avoid) out += `- 禁止: ${d.avoid}\n`;
        if (d.note) out += `- 備考: ${d.note}\n`;
        out += "\n";
      });
      out += "出力してほしいもの: 採用/不採用、保存先、カット→採用画像台帳、Claudeへ通知すべき変更点。\n";
      return out;
    }
    function show(title, text, filename) {
      $("#outTitle").textContent = title; $("#outText").value = text; $("#downloadBtn").dataset.filename = filename; $("#out").showModal(); $("#outText").select();
    }
    function copyOut() { navigator.clipboard?.writeText($("#outText").value); const b=$("#copyBtn"), o=b.textContent; b.textContent="コピーしました"; setTimeout(()=>b.textContent=o,1200); }
    function downloadOut() {
      const blob = new Blob([$("#outText").value], {type:"text/plain;charset=utf-8"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = $("#downloadBtn").dataset.filename || "image_direction.txt"; a.click(); URL.revokeObjectURL(a.href);
    }
    $("#saveBtn").addEventListener("click", saveDraft);
    $("#clearBtn").addEventListener("click", clearDraft);
    $("#genPrompt").addEventListener("click", () => show("Codex向けプロンプト", promptText(), `${EP.id}_codex_image_prompt.txt`));
    $("#exportJson").addEventListener("click", () => show("方向性JSON", JSON.stringify({ episode:EP.id, updatedAt:new Date().toISOString(), items:selectedItems().map(x => ({ visualCutId:x.cut.visualCutId, title:x.cut.title, image:x.cut.plannedImage, ...x.d })) }, null, 2), `${EP.id}_image_direction.json`));
    $("#copyBtn").addEventListener("click", copyOut);
    $("#downloadBtn").addEventListener("click", downloadOut);
    $("#closeBtn").addEventListener("click", () => $("#out").close());
    const epSel = $("#epSelect");
    EPISODES.forEach((e,i) => { const o=document.createElement("option"); o.value=String(i); o.textContent=e.label; epSel.appendChild(o); });
    epSel.value = "2";
    epSel.addEventListener("change", () => { EP = EPISODES[Number(epSel.value)] || EPISODES[0]; load(); });
    load().catch(e => $("#status").textContent = "読込失敗: " + e.message);
  </script>
</body>
</html>
